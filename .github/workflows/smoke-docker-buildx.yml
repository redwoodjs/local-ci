name: "Smoke: docker/setup-buildx-action fails to run"

# Reproduces #257 — docker/setup-buildx-action@v4 fails to run under local-ci.
#
# Reported by @PatrikTheDev. A workflow step as trivial as
#
#   - uses: docker/setup-buildx-action@v4
#
# never successfully completes inside the runner container. The action needs
# to shell out to the host's Docker daemon (via the bind-mounted socket) and
# install/start a buildx builder; something in our runner environment or
# Docker-in-Docker setup is preventing that from working the way it does on
# github.com.
#
# This smoke test creates a throwaway project with a minimal workflow that
# runs setup-buildx-action, executes it through local-ci, and fails if
# either local-ci exits non-zero or if `docker buildx version` can't be
# resolved after the action claims to have completed.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  docker-buildx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.30.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install

      - name: Build local-ci
        run: pnpm --filter run-local-ci... -r build

      - name: Create temp docker-buildx project
        run: |
          mkdir -p /tmp/docker-buildx-repro/.github/workflows

          cat > /tmp/docker-buildx-repro/package.json << 'PKG'
          { "name": "docker-buildx-repro", "private": true }
          PKG

          # Inner workflow: the one local-ci will execute inside a container
          cat > /tmp/docker-buildx-repro/.github/workflows/test.yml << 'WF'
          name: Test
          on: push
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
                - name: Verify buildx
                  run: |
                    docker buildx version
                    docker buildx ls
                    echo "buildx is working"
          WF

          # local-ci needs a git repo with a remote to resolve the repo slug
          cd /tmp/docker-buildx-repro
          git init
          git remote add origin https://github.com/test-org/docker-buildx-repro.git
          git add -A
          git -c user.name="test" -c user.email="test@test.com" commit -m "init"

      - name: Run local-ci against docker-buildx project
        id: run
        working-directory: /tmp/docker-buildx-repro
        env:
          DEBUG: "local-ci:*"
          AI_AGENT: "1" # same as --quiet: no animated TUI, but still full logs
          # Pin the per-run log dir so the assert step below has a known path.
          # Since #312 logs live next to the checks JSON (default `<stateDir>/logs`),
          # not under the runner's tmp working dir.
          LOCAL_CI_LOG_DIR: /tmp/local-ci-buildx-logs
        run: |
          # local-ci exits non-zero if any step fails, so propagate via pipefail
          set -o pipefail
          node "$GITHUB_WORKSPACE/packages/cli/dist/cli.js" \
            run --workflow .github/workflows/test.yml 2>&1 | tee /tmp/docker-buildx.out

      - name: Dump local-ci step logs
        if: always()
        run: |
          # local-ci writes per-run log artifacts under LOCAL_CI_LOG_DIR (set above);
          # its tmp working dir under /tmp/local-ci or <project>/.local-ci still
          # holds runtime state (no logs since #312).
          roots=()
          [ -d /tmp/local-ci-buildx-logs ] && roots+=(/tmp/local-ci-buildx-logs)
          [ -d /tmp/local-ci ] && roots+=(/tmp/local-ci)
          [ -d "$GITHUB_WORKSPACE/packages/cli/.local-ci" ] && roots+=("$GITHUB_WORKSPACE/packages/cli/.local-ci")
          echo "::group::local-ci runs dir"
          if [ "${#roots[@]}" -eq 0 ]; then echo "no local-ci log roots found"; fi
          for r in "${roots[@]}"; do
            ls -la "$r/" 2>/dev/null || true
            find "$r" -maxdepth 6 -type d 2>/dev/null | head -50
          done
          echo "::endgroup::"
          for f in $(find "${roots[@]}" \( -path '*/steps/*.log' -o -path '*/logs/steps/*.log' \) 2>/dev/null); do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
          for f in $(find "${roots[@]}" -name 'debug.log' 2>/dev/null); do
            echo "::group::$f"
            tail -500 "$f"
            echo "::endgroup::"
          done

      - name: Upload local-ci logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: local-ci-logs
          path: |
            /tmp/local-ci-buildx-logs/**
            /tmp/local-ci/**/logs/**
            ${{ github.workspace }}/packages/cli/.local-ci/**/logs/**
          if-no-files-found: warn

      - name: Assert `docker buildx` is usable inside local-ci
        run: |
          # local-ci runs in quiet/AI-agent mode and doesn't stream per-step
          # stdout to its top-level output. The "Verify buildx" step's output
          # lives in the per-step log file. Check it there.
          roots=()
          [ -d /tmp/local-ci-buildx-logs ] && roots+=(/tmp/local-ci-buildx-logs)
          [ -d /tmp/local-ci ] && roots+=(/tmp/local-ci)
          [ -d "$GITHUB_WORKSPACE/packages/cli/.local-ci" ] && roots+=("$GITHUB_WORKSPACE/packages/cli/.local-ci")
          if [ "${#roots[@]}" -eq 0 ]; then
            echo "::error::no local-ci log roots found — the nested run never produced logs."
            exit 1
          fi
          # Post-#312 layout: <logsDir>/<run-name>/steps/Verify-buildx.log.
          # Pre-#312 layout (kept as fallback while compat shakes out): <workDir>/runs/<run-name>/logs/steps/Verify-buildx.log.
          log=$(find "${roots[@]}" \( -path '*/steps/Verify-buildx.log' -o -path '*/logs/steps/Verify-buildx.log' \) | head -1)
          if [ -z "$log" ]; then
            echo "::error::Verify-buildx.log missing — the step never ran."
            exit 1
          fi
          if ! grep -q "buildx is working" "$log"; then
            echo "::error::'buildx is working' not found in $log"
            cat "$log"
            exit 1
          fi
          echo "OK: docker/setup-buildx-action@v4 ran and buildx is usable."
