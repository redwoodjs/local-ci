name: "Smoke: --var pre-flight"

# Proves that `vars.FOO` references in a workflow are caught up-front:
#   - Missing vars → local-ci fails before any container setup, error
#     message lists every missing var with the --var flag syntax.
#   - Partial fill → only the still-missing var appears in the error.
#   - All vars supplied → run proceeds normally.

on:
  pull_request_target:
    types: [opened, labeled, synchronize]

jobs:
  vars-preflight:
    if: '!github.event.pull_request.draft && (contains(fromJSON(''["MEMBER", "OWNER", "COLLABORATOR"]''), github.event.pull_request.author_association) || contains(github.event.pull_request.labels.*.name, ''safe-to-run''))'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.30.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install

      - name: Build local-ci
        run: pnpm --filter run-local-ci... -r build

      - name: Create temp project with a vars-using workflow
        run: |
          # Build the `${X}` GHA-expression opener from parts — the literal
          # string `${X}` must never appear in this run: script, because the
          # outer runner's template engine would substitute it before writing
          # test.yml, stripping the vars.X references the inner local-ci needs.
          D='$'
          OPEN="${D}{{"
          CLOSE='}}'

          mkdir -p /tmp/vars-repro/.github/workflows
          cat > /tmp/vars-repro/.github/workflows/test.yml <<WF
          name: Test
          on: push
          jobs:
            test:
              runs-on: ubuntu-latest
              env:
                API_URL: ${OPEN} vars.API_URL ${CLOSE}
                DEPLOY_ENV: ${OPEN} vars.DEPLOY_ENV ${CLOSE}
              steps:
                - run: |
                    echo "api=\$API_URL"
                    echo "env=\$DEPLOY_ENV"
                    [ "\$API_URL" = "https://api.example.com" ]
                    [ "\$DEPLOY_ENV" = "production" ]
          WF

          cd /tmp/vars-repro
          git init
          git remote add origin https://github.com/test-org/vars-repro.git
          git add -A
          git -c user.name="test" -c user.email="test@test.com" commit -m "init"

      - name: Case 1 — no --var flags → fails fast listing both vars
        working-directory: /tmp/vars-repro
        run: |
          set +e
          out=$(node "$GITHUB_WORKSPACE/packages/cli/dist/cli.js" \
            run --workflow .github/workflows/test.yml --quiet 2>&1)
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -eq 1 ] || { echo "expected exit 1, got $rc"; exit 1; }
          echo "$out" | grep -q "Missing vars required by workflow" || { echo "missing error header"; exit 1; }
          echo "$out" | grep -q -- "--var API_URL=<value>" || { echo "API_URL not listed"; exit 1; }
          echo "$out" | grep -q -- "--var DEPLOY_ENV=<value>" || { echo "DEPLOY_ENV not listed"; exit 1; }
          echo "✅ Case 1 passed"

      - name: Case 2 — partial --var → only still-missing var listed
        working-directory: /tmp/vars-repro
        run: |
          set +e
          out=$(node "$GITHUB_WORKSPACE/packages/cli/dist/cli.js" \
            run --workflow .github/workflows/test.yml --quiet \
            --var API_URL=https://api.example.com 2>&1)
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -eq 1 ] || { echo "expected exit 1, got $rc"; exit 1; }
          echo "$out" | grep -q -- "--var DEPLOY_ENV=<value>" || { echo "DEPLOY_ENV not listed"; exit 1; }
          if echo "$out" | grep -q "API_URL=<value>"; then
            echo "API_URL should not be listed when already supplied"; exit 1;
          fi
          echo "✅ Case 2 passed"

      - name: Case 3 — partial gh-style --var-file stdin → only still-missing var listed
        working-directory: /tmp/vars-repro
        run: |
          set +e
          out=$(printf '[{"name":"API_URL","value":"https://api.example.com"}]' | \
            node "$GITHUB_WORKSPACE/packages/cli/dist/cli.js" \
              run --workflow .github/workflows/test.yml --quiet \
              --var-file - 2>&1)
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -eq 1 ] || { echo "expected exit 1, got $rc"; exit 1; }
          echo "$out" | grep -q -- "--var DEPLOY_ENV=<value>" || { echo "DEPLOY_ENV not listed"; exit 1; }
          if echo "$out" | grep -q "API_URL=<value>"; then
            echo "API_URL should not be listed when supplied by --var-file"; exit 1;
          fi
          echo "✅ Case 3 passed"

      - name: Case 4 — all --var flags → run proceeds and job succeeds
        working-directory: /tmp/vars-repro
        run: |
          node "$GITHUB_WORKSPACE/packages/cli/dist/cli.js" \
            run --workflow .github/workflows/test.yml --quiet \
            --var API_URL=https://api.example.com \
            --var DEPLOY_ENV=production
          echo "✅ Case 4 passed"
